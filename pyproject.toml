[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorcraft-sci-toolbox"
version = "0.1.0"
description = "A Chinese scientific figure-layout companion for VectorCraft"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Qingmin666"}]
dependencies = []

[project.scripts]
vectorcraft-sci = "vectorcraft_sci.app:main"

[tool.setuptools.package-data]
vectorcraft_sci = ["web/*"]

[tool.setuptools.packages.find]
where = ["src"]
